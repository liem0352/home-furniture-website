<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" width="100%" role="img" aria-labelledby="ftTitle ftDesc">
  <title id="ftTitle">精美家居企业网站 - README 签名与 License</title>
  <desc id="ftDesc">README 底部签名条。左侧为 README MADE WITH 标识,标注使用 beautify-github-readme 与 design-taste-frontend 两个 Skill 完成视觉重设计;中部为三个迷你页面缩略图,延续 site nav map motif;右侧为作者 liem、MIT License 与仓库地址 liem0352/home-furniture-website。</desc>
  <defs>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'Courier New', monospace; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="100" rx="12" fill="#1F1B16"/>

  <!-- 顶部 motif 横线 -->
  <rect x="56" y="14" width="1088" height="1" fill="#A67C52" opacity="0.45"/>
  <!-- 底部 motif 横线 -->
  <rect x="56" y="86" width="1088" height="1" fill="#A67C52" opacity="0.45"/>

  <!-- 左侧:README MADE WITH 标识 -->
  <g transform="translate(56,30)">
    <text x="0" y="14" class="mono" font-size="10" fill="#8B8276" letter-spacing="1.2">README MADE WITH</text>
    <text x="0" y="36" class="sans" font-size="14" font-weight="600" fill="#EDE6D6">beautify-github-readme</text>
    <text x="0" y="54" class="sans" font-size="14" font-weight="600" fill="#EDE6D6">+ design-taste-frontend</text>
  </g>

  <!-- 中部:三个迷你页面缩略图(延续 site nav map motif) -->
  <g transform="translate(540,28)">
    <!-- 缩略图 1 -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="48" height="32" rx="3" fill="#2A251E" stroke="#A67C52" stroke-width="1"/>
      <rect x="3" y="3" width="42" height="2" rx="0.5" fill="#A67C52" opacity="0.8"/>
      <rect x="3" y="8" width="42" height="14" rx="1" fill="#A67C52" opacity="0.45"/>
      <rect x="3" y="25" width="13" height="5" rx="1" fill="#6B8E7F" opacity="0.7"/>
      <rect x="18" y="25" width="13" height="5" rx="1" fill="#6B8E7F" opacity="0.7"/>
      <rect x="33" y="25" width="12" height="5" rx="1" fill="#6B8E7F" opacity="0.7"/>
    </g>
    <!-- 缩略图 2 -->
    <g transform="translate(56,0)">
      <rect x="0" y="0" width="48" height="32" rx="3" fill="#2A251E" stroke="#A67C52" stroke-width="1"/>
      <rect x="3" y="3" width="42" height="2" rx="0.5" fill="#A67C52" opacity="0.8"/>
      <rect x="3" y="8" width="10" height="22" rx="1" fill="#1F1B16" stroke="#6B8E7F" stroke-opacity="0.5"/>
      <rect x="15" y="8" width="10" height="10" rx="1" fill="#A67C52" opacity="0.55"/>
      <rect x="27" y="8" width="10" height="10" rx="1" fill="#A67C52" opacity="0.55"/>
      <rect x="15" y="20" width="10" height="10" rx="1" fill="#A67C52" opacity="0.55"/>
      <rect x="27" y="20" width="10" height="10" rx="1" fill="#A67C52" opacity="0.55"/>
    </g>
    <!-- 缩略图 3 -->
    <g transform="translate(112,0)">
      <rect x="0" y="0" width="48" height="32" rx="3" fill="#2A251E" stroke="#6B8E7F" stroke-width="1"/>
      <rect x="3" y="3" width="42" height="2" rx="0.5" fill="#A67C52" opacity="0.8"/>
      <rect x="3" y="8" width="42" height="10" rx="1" fill="#1F1B16" stroke="#6B8E7F" stroke-opacity="0.4"/>
      <rect x="6" y="11" width="36" height="2" rx="0.5" fill="#8B8276" opacity="0.6"/>
      <rect x="6" y="15" width="36" height="2" rx="0.5" fill="#8B8276" opacity="0.6"/>
      <rect x="6" y="20" width="8" height="2" rx="0.5" fill="#6B8E7F"/>
      <rect x="3" y="22" width="42" height="8" rx="1" fill="#A67C52" opacity="0.3"/>
    </g>
    <text x="80" y="48" text-anchor="middle" class="mono" font-size="9" fill="#8B8276">site nav map · motif</text>
  </g>

  <!-- 右侧:作者 / License / 仓库 -->
  <g transform="translate(1144,30)">
    <text x="0" y="14" text-anchor="end" class="sans" font-size="12" fill="#EDE6D6">作者 <tspan font-weight="700" fill="#A67C52">liem</tspan></text>
    <text x="0" y="34" text-anchor="end" class="mono" font-size="11" fill="#8B8276">MIT License</text>
    <text x="0" y="54" text-anchor="end" class="mono" font-size="11" fill="#8B8276">liem0352/home-furniture-website</text>
