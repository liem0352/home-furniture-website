<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" role="img" aria-label="页面总览">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f7f4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f0f7f4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f0f7f4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="120" fill="url(#secBg)"/>
  <g transform="translate(60, 36)">
    <!-- 左侧装饰条 -->
    <rect x="0" y="8" width="4" height="36" rx="2" fill="url(#accentLine)"/>
    <!-- 标题 -->
    <text x="24" y="32" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="26" font-weight="700" fill="#1a342b" letter-spacing="-0.5">页面总览</text>
    <text x="24" y="58" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="14" font-weight="400" fill="#71717a">23 个路由页面，覆盖完整电商购物链路与内容运营模块</text>
    <!-- 右侧装饰点 -->
    <g transform="translate(1060, 10)">
      <circle cx="0" cy="14" r="3" fill="#254e3f" opacity="0.2"/>
      <circle cx="16" cy="14" r="5" fill="#fbbf24" opacity="0.3"/>
      <circle cx="36" cy="14" r="3" fill="#254e3f" opacity="0.15"/>
    </g>
  </g>
</svg>