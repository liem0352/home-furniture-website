<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-labelledby="ujTitle ujDesc">
  <title id="ujTitle">精美家居企业网站 - 用户旅程</title>
  <desc id="ujDesc">真实页面流程,五步:浏览首页(index.html 看轮播与产品推荐)、进入产品中心按床/椅/桌/柜分类筛选(product.html)、注册新账号(register.html)、登录验证身份(login.html)、提交在线留言(message.html)。每步延续 site nav map motif,显示简化页面缩略图与真实文件名,步骤之间用木纹棕箭头连接。</desc>
  <defs>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'Courier New', monospace; }
    </style>
    <marker id="ujArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A67C52"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="320" rx="16" fill="#1F1B16"/>

  <!-- 顶部 motif 横线 -->
  <rect x="56" y="22" width="1088" height="1" fill="#A67C52" opacity="0.45"/>

  <!-- 5 个步骤卡片 -->
  <g transform="translate(56,42)">

    <!-- 步骤 1: 浏览首页 -->
    <g transform="translate(0,0)">
      <text x="100" y="14" text-anchor="middle" class="mono" font-size="11" fill="#A67C52">浏览首页</text>
      <!-- 页面缩略图(延续 site nav map motif) -->
      <g transform="translate(0,24)">
        <rect x="0" y="0" width="200" height="180" rx="6" fill="#2A251E" stroke="#A67C52" stroke-width="1"/>
        <!-- 顶部导航条 -->
        <rect x="8" y="8" width="184" height="12" rx="2" fill="#A67C52" opacity="0.85"/>
        <rect x="14" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.55"/>
        <rect x="40" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.55"/>
        <rect x="66" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.55"/>
        <rect x="92" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.35"/>
        <!-- banner 轮播 -->
        <rect x="8" y="26" width="184" height="58" rx="3" fill="#A67C52" opacity="0.5"/>
        <rect x="16" y="34" width="60" height="4" rx="1" fill="#EDE6D6" opacity="0.55"/>
        <rect x="16" y="44" width="40" height="3" rx="1" fill="#EDE6D6" opacity="0.35"/>
        <!-- 轮播指示点 -->
        <rect x="80" y="74" width="6" height="3" rx="1" fill="#EDE6D6" opacity="0.7"/>
        <rect x="90" y="74" width="6" height="3" rx="1" fill="#EDE6D6" opacity="0.35"/>
        <rect x="100" y="74" width="6" height="3" rx="1" fill="#EDE6D6" opacity="0.35"/>
        <!-- 产品推荐 3 方块 -->
        <rect x="8" y="92" width="56" height="24" rx="2" fill="#6B8E7F" opacity="0.7"/>
        <rect x="72" y="92" width="56" height="24" rx="2" fill="#6B8E7F" opacity="0.7"/>
        <rect x="136" y="92" width="56" height="24" rx="2" fill="#6B8E7F" opacity="0.7"/>
        <!-- 企业介绍占位 -->
        <rect x="8" y="124" width="184" height="20" rx="2" fill="#A67C52" opacity="0.25"/>
        <rect x="16" y="132" width="80" height="3" rx="1" fill="#EDE6D6" opacity="0.5"/>
        <text x="8" y="164" class="mono" font-size="10" fill="#8B8276">index.html</text>
      </g>
      <text x="100" y="226" text-anchor="middle" class="sans" font-size="11" fill="#EDE6D6" opacity="0.85">看轮播 · 看推荐</text>
    </g>

    <!-- 步骤 2: 进入产品中心 -->
    <g transform="translate(222,0)">
      <text x="100" y="14" text-anchor="middle" class="mono" font-size="11" fill="#A67C52">分类选品</text>
      <g transform="translate(0,24)">
        <rect x="0" y="0" width="200" height="180" rx="6" fill="#2A251E" stroke="#A67C52" stroke-width="1"/>
        <rect x="8" y="8" width="184" height="12" rx="2" fill="#A67C52" opacity="0.85"/>
        <rect x="14" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.55"/>
        <rect x="40" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.55"/>
        <rect x="66" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.55"/>
        <rect x="92" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.35"/>
        <!-- 左侧分类列:床/椅/桌/柜 -->
        <rect x="8" y="26" width="44" height="148" rx="2" fill="#1F1B16" stroke="#6B8E7F" stroke-opacity="0.5"/>
        <rect x="14" y="34" width="32" height="14" rx="1" fill="#6B8E7F" opacity="0.75"/>
        <text x="30" y="44" text-anchor="middle" class="sans" font-size="9" fill="#EDE6D6">床</text>
        <rect x="14" y="54" width="32" height="14" rx="1" fill="#6B8E7F" opacity="0.4"/>
        <text x="30" y="64" text-anchor="middle" class="sans" font-size="9" fill="#EDE6D6" opacity="0.7">椅</text>
        <rect x="14" y="74" width="32" height="14" rx="1" fill="#6B8E7F" opacity="0.4"/>
        <text x="30" y="84" text-anchor="middle" class="sans" font-size="9" fill="#EDE6D6" opacity="0.7">桌</text>
        <rect x="14" y="94" width="32" height="14" rx="1" fill="#6B8E7F" opacity="0.4"/>
        <text x="30" y="104" text-anchor="middle" class="sans" font-size="9" fill="#EDE6D6" opacity="0.7">柜</text>
        <!-- 右侧 6 个产品方块 3x2 -->
        <rect x="60" y="26" width="40" height="28" rx="2" fill="#A67C52" opacity="0.55"/>
        <rect x="106" y="26" width="40" height="28" rx="2" fill="#A67C52" opacity="0.55"/>
        <rect x="152" y="26" width="40" height="28" rx="2" fill="#A67C52" opacity="0.55"/>
        <rect x="60" y="62" width="40" height="28" rx="2" fill="#A67C52" opacity="0.55"/>
        <rect x="106" y="62" width="40" height="28" rx="2" fill="#A67C52" opacity="0.55"/>
        <rect x="152" y="62" width="40" height="28" rx="2" fill="#A67C52" opacity="0.55"/>
        <!-- 分页指示 -->
        <rect x="60" y="100" width="132" height="20" rx="2" fill="#6B8E7F" opacity="0.18"/>
        <rect x="66" y="108" width="20" height="4" rx="1" fill="#EDE6D6" opacity="0.45"/>
        <rect x="90" y="108" width="20" height="4" rx="1" fill="#EDE6D6" opacity="0.45"/>
        <rect x="114" y="108" width="20" height="4" rx="1" fill="#EDE6D6" opacity="0.45"/>
        <text x="8" y="164" class="mono" font-size="10" fill="#8B8276">product.html</text>
      </g>
      <text x="100" y="226" text-anchor="middle" class="sans" font-size="11" fill="#EDE6D6" opacity="0.85">按床 / 椅 / 桌 / 柜筛选</text>
    </g>

    <!-- 步骤 3: 注册账号 -->
    <g transform="translate(444,0)">
      <text x="100" y="14" text-anchor="middle" class="mono" font-size="11" fill="#A67C52">注册账号</text>
      <g transform="translate(0,24)">
        <rect x="0" y="0" width="200" height="180" rx="6" fill="#2A251E" stroke="#A67C52" stroke-width="1"/>
        <rect x="8" y="8" width="184" height="12" rx="2" fill="#A67C52" opacity="0.85"/>
        <rect x="14" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.55"/>
        <rect x="40" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.55"/>
        <rect x="66" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.55"/>
        <rect x="92" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.35"/>
        <!-- 表单框 -->
        <rect x="40" y="34" width="120" height="118" rx="4" fill="#1F1B16" stroke="#6B8E7F" stroke-opacity="0.55"/>
        <text x="100" y="50" text-anchor="middle" class="sans" font-size="11" fill="#EDE6D6">新用户注册</text>
        <!-- 输入框1 用户名 -->
        <rect x="50" y="60" width="100" height="12" rx="2" fill="none" stroke="#8B8276" stroke-width="1"/>
        <rect x="54" y="64" width="40" height="4" rx="1" fill="#8B8276" opacity="0.55"/>
        <!-- 输入框2 密码 -->
        <rect x="50" y="78" width="100" height="12" rx="2" fill="none" stroke="#8B8276" stroke-width="1"/>
        <rect x="54" y="82" width="30" height="4" rx="1" fill="#8B8276" opacity="0.55"/>
        <!-- 输入框3 确认密码 -->
        <rect x="50" y="96" width="100" height="12" rx="2" fill="none" stroke="#8B8276" stroke-width="1"/>
        <rect x="54" y="100" width="30" height="4" rx="1" fill="#8B8276" opacity="0.55"/>
        <!-- 校验提示条 -->
        <rect x="50" y="114" width="60" height="3" rx="1" fill="#6B8E7F"/>
        <!-- 提交按钮 -->
        <rect x="62" y="126" width="76" height="14" rx="2" fill="#A67C52"/>
        <rect x="80" y="131" width="40" height="4" rx="1" fill="#EDE6D6" opacity="0.9"/>
        <text x="8" y="164" class="mono" font-size="10" fill="#8B8276">register.html</text>
      </g>
      <text x="100" y="226" text-anchor="middle" class="sans" font-size="11" fill="#EDE6D6" opacity="0.85">字段校验 · 一致性检查</text>
    </g>

    <!-- 步骤 4: 登录 -->
    <g transform="translate(666,0)">
      <text x="100" y="14" text-anchor="middle" class="mono" font-size="11" fill="#A67C52">登录验证</text>
      <g transform="translate(0,24)">
        <rect x="0" y="0" width="200" height="180" rx="6" fill="#2A251E" stroke="#A67C52" stroke-width="1"/>
        <rect x="8" y="8" width="184" height="12" rx="2" fill="#A67C52" opacity="0.85"/>
        <rect x="14" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.55"/>
        <rect x="40" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.55"/>
        <rect x="66" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.55"/>
        <rect x="92" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.35"/>
        <!-- 表单框 -->
        <rect x="50" y="34" width="100" height="98" rx="4" fill="#1F1B16" stroke="#6B8E7F" stroke-opacity="0.55"/>
        <text x="100" y="50" text-anchor="middle" class="sans" font-size="11" fill="#EDE6D6">用户登录</text>
        <rect x="58" y="60" width="84" height="12" rx="2" fill="none" stroke="#8B8276" stroke-width="1"/>
        <rect x="62" y="64" width="40" height="4" rx="1" fill="#8B8276" opacity="0.55"/>
        <rect x="58" y="78" width="84" height="12" rx="2" fill="none" stroke="#8B8276" stroke-width="1"/>
        <rect x="62" y="82" width="30" height="4" rx="1" fill="#8B8276" opacity="0.55"/>
        <!-- 锁图标占位 -->
        <circle cx="100" cy="100" r="3" fill="#6B8E7F"/>
        <rect x="70" y="110" width="60" height="14" rx="2" fill="#A67C52"/>
        <rect x="84" y="115" width="32" height="4" rx="1" fill="#EDE6D6" opacity="0.9"/>
        <text x="8" y="164" class="mono" font-size="10" fill="#8B8276">login.html</text>
      </g>
      <text x="100" y="226" text-anchor="middle" class="sans" font-size="11" fill="#EDE6D6" opacity="0.85">字段校验 · 提交拦截</text>
    </g>

    <!-- 步骤 5: 在线留言 -->
    <g transform="translate(888,0)">
      <text x="100" y="14" text-anchor="middle" class="mono" font-size="11" fill="#6B8E7F">提交留言</text>
      <g transform="translate(0,24)">
        <rect x="0" y="0" width="200" height="180" rx="6" fill="#2A251E" stroke="#6B8E7F" stroke-width="1.5"/>
        <rect x="8" y="8" width="184" height="12" rx="2" fill="#A67C52" opacity="0.85"/>
        <rect x="14" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.55"/>
        <rect x="40" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.55"/>
        <rect x="66" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.55"/>
        <rect x="92" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.35"/>
        <!-- 上方表单区 -->
        <rect x="8" y="26" width="184" height="44" rx="3" fill="#1F1B16" stroke="#6B8E7F" stroke-opacity="0.5"/>
        <rect x="14" y="32" width="172" height="8" rx="1" fill="none" stroke="#8B8276" stroke-width="1"/>
        <rect x="14" y="44" width="172" height="8" rx="1" fill="none" stroke="#8B8276" stroke-width="1"/>
        <rect x="14" y="56" width="32" height="8" rx="1" fill="#6B8E7F"/>
        <!-- 下方留言列表 -->
        <rect x="8" y="78" width="184" height="32" rx="2" fill="#2A251E" stroke="#A67C52" stroke-opacity="0.35"/>
        <rect x="14" y="86" width="8" height="16" rx="4" fill="#A67C52" opacity="0.6"/>
        <rect x="28" y="88" width="60" height="4" rx="1" fill="#EDE6D6" opacity="0.7"/>
        <rect x="28" y="96" width="140" height="3" rx="1" fill="#8B8276"/>
        <rect x="28" y="102" width="100" height="3" rx="1" fill="#8B8276" opacity="0.7"/>
        <rect x="8" y="114" width="184" height="32" rx="2" fill="#2A251E" stroke="#A67C52" stroke-opacity="0.35"/>
        <rect x="14" y="122" width="8" height="16" rx="4" fill="#A67C52" opacity="0.6"/>
        <rect x="28" y="124" width="60" height="4" rx="1" fill="#EDE6D6" opacity="0.7"/>
        <rect x="28" y="132" width="140" height="3" rx="1" fill="#8B8276"/>
        <rect x="28" y="138" width="90" height="3" rx="1" fill="#8B8276" opacity="0.7"/>
        <text x="8" y="164" class="mono" font-size="10" fill="#8B8276">message.html</text>
      </g>
      <text x="100" y="226" text-anchor="middle" class="sans" font-size="11" fill="#EDE6D6" opacity="0.85">留言追加 · 列表渲染</text>
    </g>
  </g>

  <!-- 步骤之间的连接箭头(在卡片之间) -->
  <g stroke="#A67C52" stroke-width="1.5" fill="none">
    <path d="M262,130 L274,130" marker-end="url(#ujArrow)"/>
    <path d="M484,130 L496,130" marker-end="url(#ujArrow)"/>
    <path d="M706,130 L718,130" marker-end="url(#ujArrow)"/>
    <path d="M928,130 L940,130" marker-end="url(#ujArrow)"/>
  </g>

  <!-- 底部说明 -->
  <text x="600" y="296" text-anchor="middle" class="mono" font-size="10" fill="#8B8276">流程顺序:浏览首页 → 进入产品中心选品 → 注册账号 → 登录验证 → 提交在线留言</text>
</svg>
