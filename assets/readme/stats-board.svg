<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="功能统计展示板">
  <defs>
    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7f4"/>
      <stop offset="100%" stop-color="#f5f3ee"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faf9f6"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="25" flood-color="#1a342b" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="320" fill="url(#statsBg)"/>

  <!-- 统计卡片 1 - 页面数 -->
  <g transform="translate(60, 60)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="240" height="200" rx="20" fill="url(#cardGrad)"/>
    <circle cx="48" cy="48" r="24" fill="#254e3f" opacity="0.1"/>
    <path d="M36 44 L40 52 L60 32" stroke="#254e3f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="116" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="48" font-weight="700" fill="#1a342b" letter-spacing="-1">23</text>
    <text x="48" y="148" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="15" font-weight="500" fill="#254e3f">页面路由</text>
    <text x="48" y="175" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#a1a1aa">覆盖全购物链路</text>
  </g>

  <!-- 统计卡片 2 - 组件数 -->
  <g transform="translate(320, 60)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="240" height="200" rx="20" fill="url(#cardGrad)"/>
    <circle cx="48" cy="48" r="24" fill="#fbbf24" opacity="0.2"/>
    <rect x="36" y="36" width="24" height="24" rx="6" fill="#fbbf24" opacity="0.6"/>
    <text x="48" y="116" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="48" font-weight="700" fill="#1a342b" letter-spacing="-1">17</text>
    <text x="48" y="148" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="15" font-weight="500" fill="#254e3f">通用组件</text>
    <text x="48" y="175" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#a1a1aa">可复用可扩展</text>
  </g>

  <!-- 统计卡片 3 - 产品数 -->
  <g transform="translate(580, 60)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="240" height="200" rx="20" fill="url(#cardGrad)"/>
    <circle cx="48" cy="48" r="24" fill="#5e987e" opacity="0.15"/>
    <rect x="34" y="38" width="28" height="20" rx="4" fill="none" stroke="#3d7a62" stroke-width="2"/>
    <line x1="41" y1="44" x2="55" y2="44" stroke="#3d7a62" stroke-width="1.5"/>
    <text x="48" y="116" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="48" font-weight="700" fill="#1a342b" letter-spacing="-1">10</text>
    <text x="48" y="148" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="15" font-weight="500" fill="#254e3f">产品数据</text>
    <text x="48" y="175" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#a1a1aa">8 大产品分类</text>
  </g>

  <!-- 统计卡片 4 - Hooks -->
  <g transform="translate(840, 60)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="240" height="200" rx="20" fill="url(#cardGrad)"/>
    <circle cx="48" cy="48" r="24" fill="#254e3f" opacity="0.08"/>
    <path d="M30 48 C30 38, 40 38, 48 48 C56 58, 66 58, 66 48" stroke="#254e3f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="48" y="116" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="48" font-weight="700" fill="#1a342b" letter-spacing="-1">3</text>
    <text x="48" y="148" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="15" font-weight="500" fill="#254e3f">自定义 Hooks</text>
    <text x="48" y="175" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#a1a1aa">滚动动画 / 媒体查询</text>
  </g>
</svg>