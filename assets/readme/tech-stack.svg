<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" role="img" aria-labelledby="tsTitle tsDesc">
  <title id="tsTitle">精美家居企业网站 - 技术栈分层</title>
  <desc id="tsDesc">真实技术栈四层水平堆叠:表现层(HTML5 结构 + CSS3 样式,含 Flexbox / Grid 响应式布局)、交互层(原生 JavaScript ES5+,无框架,5 个脚本)、图标层(Iconfont 矢量图标,任意缩放且色调跟随 CSS 变量)、资源层(静态图片:logo / banner 系列 / 床椅桌柜分类图)。无构建步骤、无后端依赖、浏览器直接打开运行。</desc>
  <defs>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'Courier New', monospace; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="200" rx="16" fill="#1F1B16"/>

  <!-- 顶部 motif 横线 -->
  <rect x="56" y="22" width="1088" height="1" fill="#A67C52" opacity="0.45"/>

  <!-- 层标题(无 eyebrow,纯标识) -->
  <text x="56" y="46" class="sans" font-size="13" font-weight="600" fill="#EDE6D6">技术栈分层</text>
  <text x="170" y="46" class="mono" font-size="10" fill="#8B8276">STACK · 4 layers · no build · no backend · runs in browser</text>

  <!-- 4 层水平条 -->
  <g transform="translate(56,58)">

    <!-- 层 1: 表现层 (HTML5 + CSS3) -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="1088" height="30" rx="4" fill="#2A251E" stroke="#A67C52" stroke-width="1"/>
      <!-- 顶部导航条横线 motif -->
      <rect x="8" y="6" width="1072" height="2.5" rx="1" fill="#A67C52" opacity="0.75"/>
      <!-- 左:层标签 -->
      <text x="14" y="22" class="sans" font-size="12" font-weight="600" fill="#A67C52">表现层</text>
      <!-- 中:技术清单 -->
      <text x="100" y="22" class="mono" font-size="11" fill="#EDE6D6">HTML5</text>
      <text x="150" y="22" class="sans" font-size="10" fill="#8B8276">+</text>
      <text x="162" y="22" class="mono" font-size="11" fill="#EDE6D6">CSS3</text>
      <text x="206" y="22" class="sans" font-size="10" fill="#8B8276">(Flexbox / Grid 响应式)</text>
      <!-- 右:范围 -->
      <text x="700" y="22" class="mono" font-size="10" fill="#8B8276">6 HTML · 9 CSS · reset/header/footer + 6 页专属</text>
    </g>

    <!-- 层 2: 交互层 (原生 JavaScript) -->
    <g transform="translate(0,36)">
      <rect x="0" y="0" width="1088" height="30" rx="4" fill="#2A251E" stroke="#A67C52" stroke-width="1"/>
      <rect x="8" y="6" width="1072" height="2.5" rx="1" fill="#A67C52" opacity="0.75"/>
      <text x="14" y="22" class="sans" font-size="12" font-weight="600" fill="#A67C52">交互层</text>
      <text x="100" y="22" class="mono" font-size="11" fill="#EDE6D6">原生 JavaScript</text>
      <text x="200" y="22" class="sans" font-size="10" fill="#8B8276">(ES5+,无框架,无依赖)</text>
      <text x="700" y="22" class="mono" font-size="10" fill="#8B8276">5 脚本 · index/product/login/register/message.js</text>
    </g>

    <!-- 层 3: 图标层 (Iconfont) -->
    <g transform="translate(0,72)">
      <rect x="0" y="0" width="1088" height="30" rx="4" fill="#2A251E" stroke="#6B8E7F" stroke-width="1"/>
      <rect x="8" y="6" width="1072" height="2.5" rx="1" fill="#6B8E7F" opacity="0.75"/>
      <text x="14" y="22" class="sans" font-size="12" font-weight="600" fill="#6B8E7F">图标层</text>
      <text x="100" y="22" class="mono" font-size="11" fill="#EDE6D6">Iconfont</text>
      <text x="160" y="22" class="sans" font-size="10" fill="#8B8276">(矢量图标,与位图解耦,任意缩放 / 色调跟随 CSS 变量)</text>
      <text x="700" y="22" class="mono" font-size="10" fill="#8B8276">全站统一引入 · 不依赖图片图标</text>
    </g>

    <!-- 层 4: 资源层 (静态图片) -->
    <g transform="translate(0,108)">
      <rect x="0" y="0" width="1088" height="30" rx="4" fill="#2A251E" stroke="#8B8276" stroke-width="1" stroke-dasharray="3,2"/>
      <rect x="8" y="6" width="1072" height="2.5" rx="1" fill="#8B8276" opacity="0.6"/>
      <text x="14" y="22" class="sans" font-size="12" font-weight="600" fill="#8B8276">资源层</text>
      <text x="100" y="22" class="mono" font-size="11" fill="#EDE6D6">静态图片</text>
      <text x="172" y="22" class="sans" font-size="10" fill="#8B8276">(logo / banner 系列 / 床椅桌柜分类图)</text>
      <text x="700" y="22" class="mono" font-size="10" fill="#8B8276">img/ 目录 · 12+ 张位图资源</text>
    </g>
  </g>
</svg>
