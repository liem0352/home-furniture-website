<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">精美家居企业网站 - README Hero</title>
  <desc id="heroDesc">家居企业网站前端项目的 README hero 图。左侧为项目标题、技术栈、一句话简介与资源数据(6 页面 / 9 样式表 / 5 脚本);右侧为首页、产品中心、登录、在线留言四个核心页面的简化缩略图墙,每格标注真实页面文件名。采用深木色背景(#1F1B16)、米白前景、木纹棕主色与鼠尾草绿强调色,呈现家居杂志风。</desc>
  <defs>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'Courier New', monospace; }
    </style>
  </defs>

  <!-- 背景:深木色暖黑 -->
  <rect x="0" y="0" width="1200" height="360" rx="26" fill="#1F1B16"/>

  <!-- 顶部细横线:全站统一的导航条 (site nav map motif) -->
  <rect x="56" y="34" width="1088" height="1" fill="#A67C52" opacity="0.45"/>

  <!-- 左侧:标题块 -->
  <g transform="translate(56,58)">
    <text x="0" y="14" class="mono" font-size="13" fill="#8B8276" letter-spacing="1.6">FRONTEND · FURNITURE WEBSITE</text>
    <text x="0" y="76" class="sans" font-size="46" font-weight="700" fill="#EDE6D6">精美家居企业网站</text>
    <text x="0" y="108" class="sans" font-size="18" fill="#A67C52">HTML5 · CSS3 · 原生 JavaScript · Iconfont</text>
    <rect x="0" y="128" width="64" height="1" fill="#6B8E7F"/>
    <text x="0" y="156" class="mono" font-size="13" fill="#8B8276">6 页面 · 9 样式表 · 5 脚本 · 4 家具分类</text>
    <text x="0" y="186" class="sans" font-size="14" fill="#EDE6D6" opacity="0.88">纯前端家居企业站点 - 首页 / 产品中心 /</text>
    <text x="0" y="206" class="sans" font-size="14" fill="#EDE6D6" opacity="0.88">登录注册 / 在线留言 / 企业介绍。</text>
    <text x="0" y="226" class="sans" font-size="14" fill="#EDE6D6" opacity="0.88">无后端 · 无构建步骤 · 浏览器直接打开。</text>
  </g>

  <!-- 右侧:页面缩略图墙 (site nav map motif) -->
  <g transform="translate(720,58)">

    <!-- 格1: 首页 index.html -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="200" height="130" rx="6" fill="#2A251E" stroke="#A67C52" stroke-width="1"/>
      <!-- 顶部导航条 -->
      <rect x="8" y="8" width="184" height="12" rx="2" fill="#A67C52" opacity="0.85"/>
      <rect x="14" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.55"/>
      <rect x="40" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.55"/>
      <rect x="66" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.55"/>
      <rect x="92" y="12" width="12" height="4" fill="#EDE6D6" opacity="0.35"/>
      <!-- 中部 banner 大图占位 (木纹棕) -->
      <rect x="8" y="26" width="184" height="58" rx="3" fill="#A67C52" opacity="0.5"/>
      <rect x="16" y="34" width="60" height="4" rx="1" fill="#EDE6D6" opacity="0.55"/>
      <rect x="16" y="44" width="40" height="3" rx="1" fill="#EDE6D6" opacity="0.35"/>
      <rect x="16" y="52" width="28" height="3" rx="1" fill="#EDE6D6" opacity="0.35"/>
      <!-- 底部三产品推荐方块 (鼠尾草绿) -->
      <rect x="8" y="92" width="56" height="24" rx="2" fill="#6B8E7F" opacity="0.7"/>
      <rect x="72" y="92" width="56" height="24" rx="2" fill="#6B8E7F" opacity="0.7"/>
      <rect x="136" y="92" width="56" height="24" rx="2" fill="#6B8E7F" opacity="0.7"/>
      <text x="8" y="126" class="mono" font-size="10" fill="#8B8276">index.html</text>
    </g>

    <!-- 格2: 产品中心 product.html -->
    <g transform="translate(216,0)">
      <rect x="0" y="0" width="200" height="130" rx="6" fill="#2A251E" stroke="#A67C52" stroke-width="1"/>
      <!-- 左侧分类列 -->
      <rect x="8" y="12" width="44" height="108" rx="2" fill="#1F1B16" stroke="#6B8E7F" stroke-opacity="0.5"/>
      <rect x="14" y="20" width="32" height="10" rx="1" fill="#6B8E7F" opacity="0.65"/>
      <rect x="14" y="42" width="32" height="10" rx="1" fill="#6B8E7F" opacity="0.45"/>
      <rect x="14" y="64" width="32" height="10" rx="1" fill="#6B8E7F" opacity="0.45"/>
      <rect x="14" y="86" width="32" height="10" rx="1" fill="#6B8E7F" opacity="0.45"/>
      <rect x="14" y="108" width="32" height="6" rx="1" fill="#6B8E7F" opacity="0.3"/>
      <!-- 右侧 6 个产品方块 3x2 (床/椅/桌/柜 占位) -->
      <rect x="64" y="16" width="38" height="26" rx="2" fill="#A67C52" opacity="0.55"/>
      <rect x="108" y="16" width="38" height="26" rx="2" fill="#A67C52" opacity="0.55"/>
      <rect x="152" y="16" width="38" height="26" rx="2" fill="#A67C52" opacity="0.55"/>
      <rect x="64" y="52" width="38" height="26" rx="2" fill="#A67C52" opacity="0.55"/>
      <rect x="108" y="52" width="38" height="26" rx="2" fill="#A67C52" opacity="0.55"/>
      <rect x="152" y="52" width="38" height="26" rx="2" fill="#A67C52" opacity="0.55"/>
      <!-- 分页指示条 -->
      <rect x="64" y="92" width="126" height="20" rx="2" fill="#6B8E7F" opacity="0.18"/>
      <rect x="70" y="100" width="20" height="4" rx="1" fill="#EDE6D6" opacity="0.45"/>
      <rect x="94" y="100" width="20" height="4" rx="1" fill="#EDE6D6" opacity="0.45"/>
      <rect x="118" y="100" width="20" height="4" rx="1" fill="#EDE6D6" opacity="0.45"/>
      <text x="8" y="126" class="mono" font-size="10" fill="#8B8276">product.html</text>
    </g>

    <!-- 格3: 登录 login.html -->
    <g transform="translate(0,146)">
      <rect x="0" y="0" width="200" height="130" rx="6" fill="#2A251E" stroke="#A67C52" stroke-width="1"/>
      <!-- 居中表单框 -->
      <rect x="50" y="14" width="100" height="98" rx="4" fill="#1F1B16" stroke="#6B8E7F" stroke-opacity="0.55"/>
      <!-- 标题条 -->
      <rect x="58" y="24" width="84" height="6" rx="1" fill="#EDE6D6" opacity="0.7"/>
      <!-- 输入框1 -->
      <rect x="58" y="40" width="84" height="12" rx="2" fill="none" stroke="#8B8276" stroke-width="1"/>
      <rect x="62" y="44" width="40" height="4" rx="1" fill="#8B8276" opacity="0.55"/>
      <!-- 输入框2 -->
      <rect x="58" y="58" width="84" height="12" rx="2" fill="none" stroke="#8B8276" stroke-width="1"/>
      <rect x="62" y="62" width="30" height="4" rx="1" fill="#8B8276" opacity="0.55"/>
      <!-- 提交按钮 (木纹棕) -->
      <rect x="70" y="80" width="60" height="14" rx="2" fill="#A67C52"/>
      <rect x="84" y="85" width="32" height="4" rx="1" fill="#EDE6D6" opacity="0.9"/>
      <text x="8" y="126" class="mono" font-size="10" fill="#8B8276">login.html</text>
    </g>

    <!-- 格4: 在线留言 message.html -->
    <g transform="translate(216,146)">
      <rect x="0" y="0" width="200" height="130" rx="6" fill="#2A251E" stroke="#A67C52" stroke-width="1"/>
      <!-- 上方表单区 -->
      <rect x="8" y="10" width="184" height="40" rx="3" fill="#1F1B16" stroke="#6B8E7F" stroke-opacity="0.4"/>
      <rect x="14" y="18" width="172" height="7" rx="1" fill="none" stroke="#8B8276" stroke-width="1"/>
      <rect x="14" y="30" width="172" height="7" rx="1" fill="none" stroke="#8B8276" stroke-width="1"/>
      <rect x="14" y="42" width="28" height="6" rx="1" fill="#6B8E7F"/>
      <!-- 下方留言列表条1 -->
      <rect x="8" y="58" width="184" height="28" rx="2" fill="#2A251E" stroke="#A67C52" stroke-opacity="0.35"/>
      <rect x="14" y="66" width="8" height="12" rx="4" fill="#A67C52" opacity="0.55"/>
      <rect x="28" y="68" width="60" height="4" rx="1" fill="#EDE6D6" opacity="0.7"/>
      <rect x="28" y="76" width="140" height="3" rx="1" fill="#8B8276"/>
      <rect x="28" y="82" width="100" height="3" rx="1" fill="#8B8276" opacity="0.7"/>
      <!-- 下方留言列表条2 -->
      <rect x="8" y="90" width="184" height="28" rx="2" fill="#2A251E" stroke="#A67C52" stroke-opacity="0.35"/>
      <rect x="14" y="98" width="8" height="12" rx="4" fill="#A67C52" opacity="0.55"/>
      <rect x="28" y="100" width="60" height="4" rx="1" fill="#EDE6D6" opacity="0.7"/>
      <rect x="28" y="108" width="140" height="3" rx="1" fill="#8B8276"/>
      <rect x="28" y="114" width="90" height="3" rx="1" fill="#8B8276" opacity="0.7"/>
      <text x="8" y="126" class="mono" font-size="10" fill="#8B8276">message.html</text>
    </g>
  </g>

  <!-- 底部:作者与仓库标识 -->
  <text x="56" y="336" class="mono" font-size="12" fill="#8B8276">作者 liem · MIT License</text>
  <text x="1144" y="336" text-anchor="end" class="mono" font-size="12" fill="#8B8276">liem0352/home-furniture-website</text>
</svg>
