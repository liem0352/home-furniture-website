<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" role="img" aria-label="精美家居 - 高端家居家具品牌网站 Hero">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7f4"/>
      <stop offset="50%" stop-color="#faf9f6"/>
      <stop offset="100%" stop-color="#f5f3ee"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d614d"/>
      <stop offset="100%" stop-color="#1a342b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="softCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#faf9f6" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadowLarge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="40" flood-color="#1a342b" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#1a342b" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="520" fill="url(#bgGrad)"/>

  <!-- 装饰性木纹肌理点 -->
  <g opacity="0.04">
    <circle cx="100" cy="80" r="120" fill="#254e3f"/>
    <circle cx="1080" cy="440" r="180" fill="#a89a7d"/>
    <circle cx="600" cy="260" r="280" fill="#254e3f"/>
  </g>

  <!-- 左侧文字区 -->
  <g transform="translate(72, 120)">
    <!-- 琥珀色标签徽章 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="36" rx="18" fill="url(#accentGrad)" opacity="0.15"/>
      <text x="90" y="24" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="14" font-weight="500" fill="#d97706">
        React + Vite + Tailwind
      </text>
    </g>

    <!-- 主标题 -->
    <text x="0" y="92" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="56" font-weight="700" fill="#1a342b" letter-spacing="-1.5">
      精美家居
    </text>
    <text x="0" y="148" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="28" font-weight="500" fill="#254e3f" letter-spacing="-0.5">
      品质生活，从家开始
    </text>

    <!-- 副标题 -->
    <text x="0" y="200" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="16" font-weight="400" fill="#71717a" line-height="1.7">
      <tspan x="0" dy="0">高端家居家具品牌网站，覆盖完整电商购物链路</tspan>
      <tspan x="0" dy="26">沉浸式设计语言 · 丝滑双向滚动动画 · 23 个页面</tspan>
    </text>

    <!-- 特性标签 -->
    <g transform="translate(0, 260)">
      <g transform="translate(0, 0)">
        <rect width="96" height="32" rx="16" fill="#ffffff" stroke="#e8e4d9" stroke-width="1"/>
        <text x="48" y="21" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" font-weight="500" fill="#254e3f">23 个页面</text>
      </g>
      <g transform="translate(108, 0)">
        <rect width="96" height="32" rx="16" fill="#ffffff" stroke="#e8e4d9" stroke-width="1"/>
        <text x="48" y="21" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" font-weight="500" fill="#254e3f">17 个组件</text>
      </g>
      <g transform="translate(216, 0)">
        <rect width="112" height="32" rx="16" fill="#ffffff" stroke="#e8e4d9" stroke-width="1"/>
        <text x="56" y="21" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" font-weight="500" fill="#254e3f">GSAP 动画</text>
      </g>
      <g transform="translate(340, 0)">
        <rect width="112" height="32" rx="16" fill="#ffffff" stroke="#e8e4d9" stroke-width="1"/>
        <text x="56" y="21" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" font-weight="500" fill="#254e3f">响应式</text>
      </g>
    </g>
  </g>

  <!-- 右侧层叠卡片 + 家具剪影 -->
  <g filter="url(#shadowLarge)">
    <!-- 背景卡片（深绿） -->
    <g transform="translate(720, 70)">
      <rect x="0" y="0" width="400" height="380" rx="20" fill="url(#cardGrad)"/>
      
      <!-- 卡片内装饰线 -->
      <line x1="32" y1="60" x2="368" y2="60" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      
      <!-- 顶部状态栏 -->
      <circle cx="48" cy="36" r="5" fill="#fbbf24" opacity="0.8"/>
      <circle cx="68" cy="36" r="5" fill="#5e987e" opacity="0.8"/>
      <circle cx="88" cy="36" r="5" fill="#8cbaa3" opacity="0.8"/>
      <rect x="140" y="28" width="120" height="16" rx="8" fill="#ffffff" opacity="0.1"/>
      
      <!-- 家具剪影组合 - 椅子 + 台灯 + 小桌 -->
      <g transform="translate(60, 100)" opacity="0.9">
        <!-- 椅子靠背 -->
        <rect x="40" y="20" width="80" height="100" rx="12" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
        <!-- 椅子座面 -->
        <rect x="20" y="110" width="120" height="24" rx="8" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
        <!-- 椅子腿 -->
        <rect x="28" y="134" width="6" height="80" rx="3" fill="#ffffff" fill-opacity="0.1"/>
        <rect x="126" y="134" width="6" height="80" rx="3" fill="#ffffff" fill-opacity="0.1"/>
      </g>
      
      <g transform="translate(240, 120)" opacity="0.9">
        <!-- 台灯底座 -->
        <ellipse cx="40" cy="190" rx="36" ry="8" fill="#ffffff" fill-opacity="0.12"/>
        <!-- 台灯灯杆 -->
        <rect x="36" y="100" width="8" height="90" rx="4" fill="#ffffff" fill-opacity="0.15"/>
        <!-- 台灯灯罩 -->
        <path d="M0 20 L80 20 L60 100 L20 100 Z" rx="8" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
        <!-- 光晕 -->
        <ellipse cx="40" cy="95" rx="45" ry="20" fill="#fbbf24" opacity="0.08"/>
      </g>
      
      <g transform="translate(130, 220)" opacity="0.85">
        <!-- 小圆桌桌面 -->
        <ellipse cx="50" cy="20" rx="50" ry="12" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
        <!-- 桌腿 -->
        <rect x="46" y="32" width="8" height="60" rx="4" fill="#ffffff" fill-opacity="0.1"/>
        <!-- 底座 -->
        <ellipse cx="50" cy="95" rx="20" ry="5" fill="#ffffff" fill-opacity="0.12"/>
      </g>

      <!-- 底部装饰文字 -->
      <text x="200" y="340" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#ffffff" opacity="0.4">
        forest · bone · amber
      </text>
    </g>

    <!-- 前景浮动卡片（产品卡片） -->
    <g transform="translate(660, 220)" filter="url(#shadowSoft)">
      <rect x="0" y="0" width="200" height="180" rx="16" fill="#ffffff"/>
      
      <!-- 产品图占位 -->
      <rect x="16" y="16" width="168" height="100" rx="10" fill="#f5f3ee"/>
      <rect x="40" y="36" width="120" height="60" rx="6" fill="#e8e4d9" opacity="0.6"/>
      
      <!-- 产品名 -->
      <rect x="16" y="128" width="100" height="14" rx="7" fill="#e8e4d9"/>
      <!-- 价格 -->
      <rect x="16" y="150" width="60" height="16" rx="8" fill="#1a342b"/>
      
      <!-- 琥珀色标签 -->
      <circle cx="172" cy="32" r="12" fill="#fbbf24"/>
    </g>

    <!-- 小装饰卡片（统计数字） -->
    <g transform="translate(900, 50)" filter="url(#shadowSoft)">
      <rect x="0" y="0" width="140" height="72" rx="12" fill="#ffffff"/>
      <text x="20" y="34" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="24" font-weight="700" fill="#254e3f">10+</text>
      <text x="20" y="54" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#a1a1aa">产品品类</text>
    </g>
  </g>

  <!-- 底部渐隐过渡 -->
  <rect x="0" y="460" width="1200" height="60" fill="url(#bgGrad)" opacity="0.8"/>
</svg>